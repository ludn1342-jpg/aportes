<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago PSE - Aportes en Linea</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f5f5f5;color:#333}
.header{background:#012D25;padding:20px 0;text-align:center}
.header img{height:40px}
.header h1{color:white;font-size:20px;margin-top:8px;font-weight:400}
.header p{color:rgba(255,255,255,.8);font-size:14px;margin-top:4px}
.container{max-width:500px;margin:30px auto;padding:0 20px}
.card{background:white;border-radius:16px;padding:32px 28px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card h2{color:#012D25;font-size:20px;margin-bottom:6px}
.card .subtitulo{color:#555;font-size:14px;margin-bottom:24px}
.resumen{background:#f0f9f7;border-radius:10px;padding:14px 18px;margin-bottom:24px;border-left:4px solid #012D25}
.resumen p{font-size:14px;margin-bottom:4px}
.resumen .monto{font-size:22px;font-weight:bold;color:#012D25}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:14px;font-weight:600;color:#333;margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;transition:border .2s;outline:none;background:white}
.form-group input:focus,.form-group select:focus{border-color:#012D25}
.form-group input::placeholder{color:#aaa}
.btn-pagar{width:100%;padding:14px;background:#012D25;color:white;border:none;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;transition:background .2s;margin-top:8px}
.btn-pagar:hover{background:#024d3f}
.btn-pagar:disabled{background:#999;cursor:not-allowed}
.btn-volver{display:block;text-align:center;margin-top:16px;color:#012D25;text-decoration:none;font-size:14px;font-weight:500}
.pse-badge{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;padding:10px;background:#f8f8f8;border-radius:8px}
.pse-badge img{height:30px}
.pse-badge span{font-size:13px;color:#555}
/* Overlay de carga */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:20px}
.overlay.active{display:flex}
.overlay img{width:140px}
.spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top:4px solid #012D25;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{color:#012D25;font-size:16px;font-weight:500}
.error-msg{background:#fee;color:#c00;padding:12px;border-radius:8px;font-size:14px;margin-top:12px;display:none}
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <img src="/img/logoAEL70.png" alt="Aportes en Linea">
  <div class="spinner"></div>
  <p id="overlay-texto">Generando link de pago PSE...</p>
</div>

<div class="header">
  <img src="/img/logoAEL70.png" alt="Aportes en Linea" onerror="this.style.display='none'">
  <h1>Pago electronico</h1>
  <p>Realiza el pago de tus aportes a traves de la plataforma PSE.</p>
</div>

<div class="container">
  <div class="card">
    <h2>Datos para el pago</h2>
    <p class="subtitulo">Completa la informacion para realizar tu pago por PSE</p>

    <div class="resumen" id="resumen">
      <p>Planilla N&deg; <strong id="res-planilla">-</strong></p>
      <p class="monto">$ <span id="res-monto">0</span></p>
    </div>

    <div class="pse-badge">
      <img src="/img/pse.png" alt="PSE" onerror="this.style.display='none'">
      <span>Pago seguro con PSE</span>
    </div>

    <form id="formPago" onsubmit="return iniciarPago(event)">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ingresa tu nombre completo" required>
      </div>

      <div class="form-group">
        <label for="documento">Numero de cedula</label>
        <input type="text" id="documento" placeholder="Ingresa tu numero de cedula" required pattern="[0-9]+" inputmode="numeric">
      </div>

      <div class="form-group">
        <label for="telefono">Telefono (opcional)</label>
        <input type="tel" id="telefono" placeholder="Ej: 3001234567" inputmode="tel">
      </div>

      <div class="form-group">
        <label for="banco">Selecciona tu banco</label>
        <select id="banco" required>
          <option value="">Cargando bancos...</option>
        </select>
      </div>

      <button type="submit" class="btn-pagar" id="btnPagar">Pagar con PSE</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <a href="/" class="btn-volver">&larr; Volver a consulta</a>
  </div>
</div>

<script>
// Leer datos de la URL
var params = new URLSearchParams(window.location.search);
var monto = params.get('monto') || '';
var planilla = params.get('planilla') || '';
var nombre = params.get('nombre') || '';
var documento = params.get('documento') || '';

// Prellenar campos
document.getElementById('res-planilla').textContent = planilla || '-';
document.getElementById('res-monto').textContent = Number(monto || 0).toLocaleString('es-CO');
if (nombre) document.getElementById('nombre').value = nombre;
if (documento) document.getElementById('documento').value = documento;

// Cargar bancos reales desde RappiPay
fetch('/pse/bancos')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var sel = document.getElementById('banco');
    sel.innerHTML = '<option value="">-- Selecciona un banco --</option>';
    if (data.ok && data.bancos && data.bancos.length) {
      data.bancos.forEach(function(b) {
        var opt = document.createElement('option');
        opt.value = b.code || b.bank_code || b.id || '';
        opt.textContent = b.name || b.bank_name || b.description || '';
        opt.setAttribute('data-name', b.name || b.bank_name || '');
        sel.appendChild(opt);
      });
    }
  })
  .catch(function() {
    var sel = document.getElementById('banco');
    sel.innerHTML = '<option value="">-- Error cargando bancos --</option>';
  });

function mostrarError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function iniciarPago(e) {
  e.preventDefault();
  var nom = document.getElementById('nombre').value.trim();
  var doc = document.getElementById('documento').value.trim();
  var bancoSel = document.getElementById('banco');
  var bankCode = bancoSel.value;
  var bankName = bancoSel.options[bancoSel.selectedIndex] ? bancoSel.options[bancoSel.selectedIndex].getAttribute('data-name') || bancoSel.options[bancoSel.selectedIndex].text : '';

  if (!nom || !doc || !bankCode) {
    mostrarError('Por favor completa todos los campos obligatorios.');
    return false;
  }

  document.getElementById('overlay').classList.add('active');
  document.getElementById('overlay-texto').textContent = 'Conectando con tu banco...';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('btnPagar').disabled = true;

  fetch('/pse/pagar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      bank_code: bankCode,
      bank_name: bankName,
      document_type: 'CC',
      document_number: doc,
      amount: Number(monto)
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.ok && data.bank_url) {
      document.getElementById('overlay-texto').textContent = 'Redirigiendo al banco...';
      setTimeout(function() {
        window.location.href = data.bank_url;
      }, 500);
    } else {
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('btnPagar').disabled = false;
      mostrarError(data.error || 'No se pudo procesar el pago. Intenta de nuevo.');
    }
  })
  .catch(function(err) {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('btnPagar').disabled = false;
    mostrarError('Error de conexión. Intenta de nuevo.');
  });

  return false;
}
</script>
</body>
</html>
